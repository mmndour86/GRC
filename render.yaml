# Blueprint Render : déploie la plateforme (service web Docker) et sa base
# PostgreSQL managée en une seule fois, sans serveur ni nom de domaine à gérer.
#
# Utilisation : sur render.com, "New +" -> "Blueprint" -> connectez le dépôt
# Git contenant ce projet -> Render lit ce fichier et provisionne les deux
# ressources ci-dessous, en reliant automatiquement DATABASE_URL.
#
# Le plan "0.5c-512mb" / "0.1c-256mb" est le premier palier payant (~13 $/mois
# au total) : largement suffisant pour cette plateforme, et nécessaire pour un
# usage réel — le plan "free" existe mais Render supprime la base PostgreSQL
# gratuite au bout de 30 jours (voir le README).

services:
  - type: web
    runtime: docker
    name: grc-platform
    plan: 0.5c-512mb
    dockerfilePath: ./Dockerfile
    healthCheckPath: /_stcore/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: grc-postgres
          property: connectionString

databases:
  - name: grc-postgres
    plan: 0.1c-256mb
