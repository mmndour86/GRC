# Surcouche à docker-compose.yml pour une exposition sur Internet en HTTPS,
# via un reverse proxy Caddy qui obtient et renouvelle seul un certificat
# Let's Encrypt à partir du nom de domaine défini dans .env (DOMAIN=...).
#
# Utilisation :
#   docker compose -f docker-compose.yml -f docker-compose.https.yml up -d --build
#
# Cette surcouche retire la publication directe du port 8501 sur l'hôte :
# seul Caddy (ports 80/443) est exposé publiquement. L'application n'est plus
# joignable que via https://<DOMAIN>.

services:
  app:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:?définissez DOMAIN (nom de domaine pointant vers ce serveur) dans .env}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - grc_caddy_data:/data
      - grc_caddy_config:/config

volumes:
  grc_caddy_data:
  grc_caddy_config:
